# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Blinux install medium on BIOS with the speakup screen reader (default).
Install Blinux or repair a system with speech feedback.
ENDTEXT
MENU LABEL Blinux install medium with ^speech (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on

LABEL arch
TEXT HELP
Boot the Blinux install medium on BIOS without speech.
Install Blinux or repair a system.
ENDTEXT
MENU LABEL Blinux install medium without speech (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
