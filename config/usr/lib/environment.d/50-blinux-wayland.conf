# Blinux runs GNOME on Wayland only. Prefer Wayland in every toolkit and fall
# back to X11 through XWayland for apps that only speak X11 (e.g. ROOT's
# TBrowser and canvases).
QT_QPA_PLATFORM=wayland;xcb
MOZ_ENABLE_WAYLAND=1
# GTK 3/4 load the AT-SPI bridge on their own; Qt needs to be told.
QT_ACCESSIBILITY=1
QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
