# Installed by "blinux-console-speech enable".
# espeakup speaks through the user's PulseAudio socket (see
# /etc/pulse/default.pa.d/10-blinux-espeakup.pa). With nobody logged in the
# socket is missing and espeak-ng falls back to ALSA.
[Service]
Environment=PULSE_SERVER=unix:/tmp/blinux-pulse.sock
Environment="default_voice=en"
