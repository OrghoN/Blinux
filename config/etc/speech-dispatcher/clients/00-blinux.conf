# Blinux speech-dispatcher defaults, included from speechd.conf.
# Orca speaks through speech-dispatcher -> espeak-ng -> PulseAudio.
# PulseAudio is the sound server on Blinux (PipeWire only does video), so
# speech goes straight to it.
AudioOutputMethod "pulse"
DefaultModule espeak-ng
DefaultLanguage "en"
DefaultVoiceType "MALE1"
DefaultRate 0
DefaultPunctuationMode "some"
