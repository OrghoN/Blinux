# Nightly: rebuild everything against the latest Arch, run the full layer 4
# matrix and the layer 5 accessibility tests, and keep one tracking issue
# open while anything fails.
name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/free-disk.sh
      - name: Rebuild every package against today's Arch
        run: scripts/ci/arch-run.sh "devtools" scripts/build-repo.sh --force
      - name: Resolution matrix and smoke tests, heavy stacks included
        run: scripts/ci/arch-run.sh "devtools arch-install-scripts" env SMOKE_HEAVY=1 make --no-print-directory packages-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo
          path: repo/x86_64
          retention-days: 2

  iso:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/free-disk.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repo
          path: repo/x86_64
      - run: scripts/ci/arch-run.sh "archiso" scripts/build-iso.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso
          path: out/*.iso
          retention-days: 2
          compression-level: 0

  live-boot:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        firmware: [uefi, bios]
    steps: &qemu-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/enable-kvm.sh
      - name: Install QEMU and the test harness
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf xorriso
          python3 -m pip install --user -r tests/integration/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/blinux-stt
          key: stt-model-${{ hashFiles('tests/harness/stt.py') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: out
      - name: Run tests
        run: make ${{ matrix.target || 'test-iso' }} FIRMWARE="${{ matrix.firmware }}" CASES="${{ matrix.case }}" PYTEST_ARGS="${{ matrix.pytest_args || '-k test_live' }}"
      - name: Keep logs, audio and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ github.job }}-${{ matrix.firmware }}${{ matrix.case }}
          path: |
            tests/integration/artifacts/*.log
            tests/integration/artifacts/*.wav
            tests/integration/artifacts/*.ppm
            tests/integration/artifacts/*.txt
          retention-days: 14

  install:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        case: [minimal, encrypted, bios, console-speech, offline, all-stacks, nvidia-cuda]
        pytest_args: ['-k test_first_boot']
    steps: *qemu-steps

  a11y:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        target: [test-a11y]
        pytest_args: ['-m a11y']
    steps: *qemu-steps

  report:
    needs: [packages, iso, live-boot, install, a11y]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the nightly-failure issue
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"$RESULTS" | paste -sd, -)
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number --jq '.[0].number // empty')
          if [[ -n "$failed" ]]; then
            body="Nightly run failed in: $failed. Logs: $RUN_URL"
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body "$body"
            else
              gh label create nightly-failure -R "$GITHUB_REPOSITORY" --color B60205 2>/dev/null || true
              gh issue create -R "$GITHUB_REPOSITORY" --title "Nightly build is failing" --label nightly-failure --body "$body"
            fi
            exit 1
          elif [[ -n "$issue" ]]; then
            gh issue close "$issue" -R "$GITHUB_REPOSITORY" --comment "Fixed: the nightly run passed. $RUN_URL"
          fi
