# Pull request and main-branch CI. Every job runs a Makefile target, so any
# failure can be reproduced locally with the same command.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LINT_TOOLS: >-
    git make shellcheck shfmt bats jq python python-jsonschema
    markdownlint-cli2 lychee dconf desktop-file-utils emacs-nox sudo

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install lint tools
        run: pacman -Syu --noconfirm --needed $LINT_TOOLS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: make lint
        run: make lint STRICT=1

  unit:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm --needed $LINT_TOOLS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: make unit
        run: make unit

  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      iso: ${{ steps.filter.outputs.iso }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            packages:
              - 'pkgbuilds/**'
              - 'packages/**'
              - 'tools/**'
              - 'config/**'
              - 'scripts/build-repo.sh'
            iso:
              - 'profile/**'
              - 'scripts/build-iso.sh'
              - 'tools/**'
              - 'config/**'
              - 'packages/**'
              - 'tests/integration/**'

  packages:
    needs: [lint, unit, changes]
    if: needs.changes.outputs.packages == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/free-disk.sh
      - name: Seed from [blinux-testing] so only changed packages rebuild
        run: scripts/repo-release.sh fetch repo-testing
      - name: Build packages in clean chroots
        run: scripts/ci/arch-run.sh "devtools" scripts/build-repo.sh
      - name: Package resolution matrix and smoke tests
        run: scripts/ci/arch-run.sh "devtools arch-install-scripts" make --no-print-directory packages-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo
          path: repo/x86_64
          retention-days: 3

  iso:
    needs: [lint, unit, changes, packages]
    if: >-
      always() && needs.lint.result == 'success' && needs.unit.result == 'success' &&
      (needs.packages.result == 'success' ||
       (needs.packages.result == 'skipped' && needs.changes.outputs.iso == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/free-disk.sh
      - name: Get the package repo from this run
        if: needs.packages.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repo
          path: repo/x86_64
      - name: Get the package repo from [blinux-testing]
        if: needs.packages.result == 'skipped'
        run: scripts/repo-release.sh fetch repo-testing
      - name: Build the ISO
        run: scripts/ci/arch-run.sh "archiso" scripts/build-iso.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso
          path: |
            out/*.iso
            out/sha256sums
            out/b2sums
          retention-days: 3
          compression-level: 0

  integration-smoke:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/enable-kvm.sh
      - name: Install QEMU and the test harness
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf xorriso
          python3 -m pip install --user -r tests/integration/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/blinux-stt
          key: stt-model-${{ hashFiles('tests/harness/stt.py') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: out
      - name: Boot speech + minimal install (UEFI)
        run: make test-iso CASES=minimal FIRMWARE=uefi
      - name: Keep logs, audio and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-smoke-artifacts
          path: tests/integration/artifacts
          retention-days: 14
