# CD for releases. Pushing a tag vX.Y.Z:
#   1. builds and signs every package with the release key
#   2. builds the ISO from exactly those packages
#   3. runs the full automated suite (layers 4 and 5) against that ISO
#   4. publishes the signed packages to the stable [blinux] repo
#   5. signs the ISO, writes checksums, and creates a DRAFT GitHub Release with
#      the manual release checklist attached
# The maintainer publishes the draft once the screen-off checklist passes.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The signing key must be published in the repository
        run: |
          test -f keys/blinux.asc || { echo "keys/blinux.asc is missing: see keys/README.md"; exit 1; }
      - run: scripts/ci/free-disk.sh
      - name: Import the release signing key
        env:
          SIGNING_KEY: ${{ secrets.BLINUX_GPG_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.BLINUX_GPG_PASSPHRASE }}
        run: scripts/ci/import-key.sh
      - name: Start from the current stable [blinux]
        run: scripts/repo-release.sh fetch repo
      - name: Build and sign
        run: scripts/ci/arch-run.sh "devtools" scripts/build-repo.sh --force
      - name: Resolution matrix and smoke tests
        run: scripts/ci/arch-run.sh "devtools arch-install-scripts" env SMOKE_HEAVY=1 make --no-print-directory packages-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-repo
          path: repo/x86_64
          retention-days: 7

  iso:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/free-disk.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-repo
          path: repo/x86_64
      - name: Build the ISO
        run: scripts/ci/arch-run.sh "archiso" scripts/build-iso.sh
      - name: Check the size limit for release assets
        run: |
          size=$(stat -c %s out/blinux-*.iso)
          if (( size > 2147483648 )); then
            echo "The ISO is $((size / 1048576)) MiB, over GitHub's 2 GiB release asset limit."
            echo "Trim the base stack or host the ISO elsewhere (see docs/build-plan.md, Risks)."
            exit 1
          fi
      - name: Import the release signing key
        env:
          SIGNING_KEY: ${{ secrets.BLINUX_GPG_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.BLINUX_GPG_PASSPHRASE }}
        run: scripts/ci/import-key.sh
      - name: Sign the ISO
        run: |
          cd out
          for iso in blinux-*.iso; do gpg --batch --yes --detach-sign -u "$GPGKEY" "$iso"; done
          gpg --batch --yes --detach-sign -u "$GPGKEY" sha256sums
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-iso
          path: out/
          retention-days: 7
          compression-level: 0

  test:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: true
      matrix:
        include:
          - {target: test-iso, firmware: uefi, pytest_args: '-k test_live'}
          - {target: test-iso, firmware: bios, pytest_args: '-k test_live'}
          - {target: test-iso, case: minimal, pytest_args: '-k test_first_boot'}
          - {target: test-iso, case: encrypted, pytest_args: '-k test_first_boot'}
          - {target: test-iso, case: bios, pytest_args: '-k test_first_boot'}
          - {target: test-iso, case: console-speech, pytest_args: '-k test_first_boot'}
          - {target: test-iso, case: offline, pytest_args: '-k test_first_boot'}
          - {target: test-iso, case: all-stacks, pytest_args: '-k test_first_boot'}
          - {target: test-iso, case: nvidia-cuda, pytest_args: '-k test_first_boot'}
          - {target: test-a11y, pytest_args: '-m a11y'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/enable-kvm.sh
      - name: Install QEMU and the test harness
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf xorriso
          python3 -m pip install --user -r tests/integration/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-iso
          path: out
      - name: Run tests against the release ISO
        run: make ${{ matrix.target }} FIRMWARE="${{ matrix.firmware }}" CASES="${{ matrix.case }}" PYTEST_ARGS="${{ matrix.pytest_args }}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-artifacts-${{ strategy.job-index }}
          path: tests/integration/artifacts
          retention-days: 30

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-repo
          path: repo/x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-iso
          path: out
      - name: Publish the signed packages to the stable [blinux] repo
        run: scripts/repo-release.sh publish repo
      - name: Create the draft release
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "## Blinux $TAG"
            echo
            echo "Verify the download before writing it to a USB stick:"
            echo
            echo '```sh'
            echo "gpg --verify $(cd out && ls blinux-*.iso).sig"
            echo "sha256sum -c sha256sums"
            echo '```'
            echo
            echo "### Changes"
            git log --no-merges --format='- %s' ${prev:+$prev..}"$TAG"
            echo
            echo "This is a draft. Publish it once the attached release checklist is complete."
          } > notes.md
          cp tests/manual/release-checklist.md "out/release-checklist-$TAG.md"
          gh release create "$TAG" --draft --title "Blinux $TAG" --notes-file notes.md \
            out/blinux-*.iso out/blinux-*.iso.sig out/sha256sums out/sha256sums.sig out/b2sums \
            "out/release-checklist-$TAG.md"
